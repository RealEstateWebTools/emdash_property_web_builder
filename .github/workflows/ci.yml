name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_visual_baselines:
        description: 'Regenerate visual regression baselines and upload them as an artifact'
        type: boolean
        default: false

jobs:
  test:
    name: Lint, typecheck, and unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the packageManager field in package.json —
      # passing one here too makes action-setup@v4 hard-error on the conflict.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Catches seed-schema drift (e.g. field types removed by an EmDash
      # upgrade) in the fast job instead of at the E2E seed step.
      - name: Validate seed profiles
        run: |
          npx emdash seed seed/seed.json --validate
          npx emdash seed seed/profiles/minimal.json --validate
          npx emdash seed seed/profiles/pre-launch.json --validate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests with coverage
        run: pnpm test:coverage

      # Offline fixture metadata only; no login, publishing, or real identity.
      - name: Verify properties plugin bundle
        run: pnpm run plugin:pwb-properties:verify

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    # E2E tests require PWB_API_URL — only run when the secret is available.
    # On fork PRs, secrets are not available; skip gracefully.
    if: ${{ vars.RUN_E2E == 'true' || github.event_name == 'push' }}

    env:
      PWB_API_URL: ${{ secrets.PWB_API_URL }}

    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the packageManager field in package.json —
      # passing one here too makes action-setup@v4 hard-error on the conflict.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # The E2E specs assume demo content exists (blog.spec.ts expects the
      # seeded posts; minimal.json seeds no posts at all).
      - name: Seed database
        run: pnpm seed:demo
        env:
          NODE_ENV: development

      # Visual regression runs in its own job below (mocked PWB backend).
      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  visual:
    name: Visual regression (Playwright)
    runs-on: ubuntu-latest
    # Needs no secrets: scripts/visual-test-server.mjs seeds its own database
    # and serves PWB fixtures from a local mock, so this runs on fork PRs too.

    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the packageManager field in package.json —
      # passing one here too makes action-setup@v4 hard-error on the conflict.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run visual regression tests
        if: ${{ !inputs.update_visual_baselines }}
        run: pnpm test:visual
        env:
          CI: true
          NODE_ENV: development

      # The site without PWB: native EmDash listings, settings-based site
      # details, enquiries stored in EmDash.
      - name: Run native listings tests
        if: ${{ !inputs.update_visual_baselines }}
        run: pnpm test:native
        env:
          CI: true
          NODE_ENV: development

      # Baselines are platform-specific, so they are generated here rather
      # than on a laptop. Download the artifact and commit its PNGs into
      # e2e/visual-regression.spec.ts-snapshots/.
      - name: Regenerate visual baselines
        if: ${{ inputs.update_visual_baselines }}
        run: pnpm test:visual --update-snapshots
        env:
          CI: true
          NODE_ENV: development

      - name: Upload regenerated baselines
        if: ${{ inputs.update_visual_baselines }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: e2e/visual-regression.spec.ts-snapshots/*-linux.png
          retention-days: 7

      - name: Upload visual report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: |
            playwright-report/visual/
            playwright-report/native/
            test-results/
          retention-days: 7
